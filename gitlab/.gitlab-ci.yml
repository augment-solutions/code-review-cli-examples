# GitLab Code Review CI/CD Configuration
# This configuration provides AI-powered code review for merge requests
# using Augment Code's auggie CLI tool.
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to your repository root as .gitlab-ci.yml (or include it)
# 2. Copy pr-review.md to .augment/prompts/pr-review.md
# 3. Configure the required CI/CD variables (see README.md)

stages:
  - review

# AI-Powered Merge Request Review
# Automatically reviews MRs and posts summary comments with inline feedback
augment-pr-review:
  stage: review
  image: node:22
  before_script:
    - npm install -g @augmentcode/auggie
    - auggie --version
  script:
    - |
      # Debug: Check if required variables are set
      echo "AUGMENT_SESSION_AUTH is set: ${AUGMENT_SESSION_AUTH:+yes}"
      echo "GITLAB_PERSONAL_ACCESS_TOKEN is set: ${GITLAB_PERSONAL_ACCESS_TOKEN:+yes}"
      
      if [ -z "${AUGMENT_SESSION_AUTH}" ]; then
        echo "ERROR: AUGMENT_SESSION_AUTH is not set"
        exit 1
      fi
      
      if [ -z "${GITLAB_PERSONAL_ACCESS_TOKEN}" ]; then
        echo "ERROR: GITLAB_PERSONAL_ACCESS_TOKEN is not set"
        exit 1
      fi
    - |
      # Add GitLab MCP server for API access
      auggie mcp add gitlab \
        --command npx \
        --args "-y @zereight/mcp-gitlab" \
        --env GITLAB_PERSONAL_ACCESS_TOKEN="${GITLAB_PERSONAL_ACCESS_TOKEN}" \
        --env GITLAB_API_URL="${CI_API_V4_URL}"
    - auggie mcp list
    - |
      # Run the code review
      auggie --print --instruction-file review-prompt.md
  rules:
    # Only run on merge request events
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  # Allow the review to fail without blocking the pipeline
  allow_failure: true

